name: Generate & Sync PHP SDK

on:
  workflow_dispatch:
    inputs:
      spec_url:
        description: "OpenAPI Specification URL"
        required: false
        default: "https://api.komikhq.com/openapi.json"
      release_version:
        description: "Release tag version (e.g. v1.0.0)"
        required: false
      dry_run:
        description: "Dry-run mode (do not push to target repo)"
        type: boolean
        required: false
        default: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Generate Bot Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KOMIKHQ_BOT_APP_ID }}
          private-key: ${{ secrets.KOMIKHQ_BOT_PRIVATE_KEY }}
          owner: komikhq

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SDK
        run: pnpm generate php --spec "${{ github.event.inputs.spec_url || 'https://api.komikhq.com/openapi.json' }}"

      - name: Audit Branding
        run: pnpm audit:branding

      - name: Sync & Release
        env:
          BOT_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_APP_ID: ${{ secrets.KOMIKHQ_BOT_APP_ID }}
          TARGET_REPO: "komikhq/komikhq-php"
          SOURCE_DIR: "out/php"
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: pnpm sync:release
